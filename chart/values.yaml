# =============================================================================
# Default values for the reusable mcp-server chart.
#
# These are the SAFE defaults. Each MCP server overrides what it needs in
# servers/<name>.yaml, and the ApplicationSet injects the environment-specific
# bits (env name, vault path prefix, replicas, etc.) at render time.
#
# Anything written as <path:...#key> is NOT resolved by Helm. It is left
# verbatim in the rendered manifest and resolved by the Argo CD Vault Plugin
# (AVP), which pulls the value from HashiCorp Vault. AVP can run either inside
# Argo CD (GitOps) OR standalone in your CI pipeline via `argocd-vault-plugin
# generate` (non-GitOps -- see deploy/deploy.sh).
# =============================================================================

# Logical name of this MCP server. Defaults to the chart fullname; servers
# normally set this in servers/<name>.yaml.
nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# Environment context.
# GitOps:     the ApplicationSet sets env.name + env.vaultMount per environment.
# Non-GitOps: your CI passes `--set env.name=<env>` (and optionally
#             `--set env.namespace=<seg>`); see deploy/deploy.sh.
# Either way the same chart renders a prod and a qual instance with
# correctly-routed secrets.
# -----------------------------------------------------------------------------
env:
  # prod | qual  -- injected by the ApplicationSet (GitOps) or `--set` (CI).
  name: qual
  # The segment substituted for the {{namespace}} token inside Vault paths,
  # e.g. the "qual" in <path:secret/data/mcp/qual/...>. Leave empty to default
  # to env.name. Set it only if your Vault path segment differs from env.name.
  namespace: ""
  # Full Vault KV-v2 mount + prefix, substituted for the legacy {{vault}} token.
  # The ApplicationSet composes this from the env name so secrets auto-route:
  #   prod -> secret/data/mcp/prod
  #   qual -> secret/data/mcp/qual
  # If you reference Vault with the {{namespace}} token instead (recommended for
  # the non-GitOps flow), you can ignore this.
  vaultMount: "secret/data/mcp/qual"

# -----------------------------------------------------------------------------
# Container image. registry + repository + tag are kept separate so a server
# can switch container registries without touching anything else.
# -----------------------------------------------------------------------------
image:
  registry: "registry.example.com"
  repository: "mcp/example-server"
  tag: "latest"
  # IfNotPresent is safe with immutable, unique tags (recommended: push a new
  # tag per build, e.g. the commit SHA, so every deploy rolls automatically).
  # Switch to Always if you re-push a mutable tag (e.g. "latest") and rely on
  # `oc rollout restart` / podAnnotations to force a redeploy.
  pullPolicy: IfNotPresent
# Name of an existing imagePullSecret (optional). Can itself be vault-backed.
imagePullSecrets: []
#  - name: registry-creds

# -----------------------------------------------------------------------------
# OpenShift ImageStream (optional, non-GitOps friendly).
#
# When enabled, the chart creates an ImageStream that tracks image.* from your
# registry and adds an `image.openshift.io/triggers` annotation to the
# Deployment. OpenShift then auto-redeploys whenever a new image is imported
# into the stream -- this is the "image stream" workflow. Leave disabled if you
# drive rollouts purely by changing image.tag from CI.
# -----------------------------------------------------------------------------
imageStream:
  enabled: false
  # Tag name tracked on the ImageStream (the istag the Deployment follows).
  # Defaults to env.name when empty (e.g. example-server-qual:qual).
  tag: ""
  # Periodically re-import the upstream tag so re-pushes of a mutable tag are
  # picked up automatically (needed when you re-push e.g. "latest").
  scheduledImport: true
  # importPolicy.importMode: Legacy (single arch) | PreserveOriginal (manifest list).
  importMode: Legacy
  # Set true to import from an insecure (non-TLS / self-signed) registry.
  insecure: false

replicaCount: 1

# -----------------------------------------------------------------------------
# Plain (non-secret) environment variables. Rendered straight into the
# container env.
# -----------------------------------------------------------------------------
extraEnv: {}
#  LOG_LEVEL: info
#  MCP_TRANSPORT: stdio

# -----------------------------------------------------------------------------
# Secret environment variables.
#
# Each entry's value is a Vault reference. Use the literal token "{{namespace}}"
# as a stand-in for the per-environment segment -- the chart substitutes
# env.namespace (default env.name) for it. This is what gives you automatic
# prod/qual routing:
#
#   secretEnv:
#     OPENAI_API_KEY: "<path:secret/data/mcp/{{namespace}}/example-server#openai_api_key>"
#
# renders for qual as:
#   <path:secret/data/mcp/qual/example-server#openai_api_key>
# and for prod as:
#   <path:secret/data/mcp/prod/example-server#openai_api_key>
#
# The legacy "{{vault}}" token (-> env.vaultMount) also still works.
# AVP resolves the <path:...> into a real Secret -- at Argo sync time (GitOps)
# or in your CI pipeline via `argocd-vault-plugin generate` (non-GitOps).
# -----------------------------------------------------------------------------
secretEnv: {}
#  OPENAI_API_KEY: "<path:secret/data/mcp/{{namespace}}/example-server#openai_api_key>"
#  DB_PASSWORD: "<path:secret/data/mcp/{{namespace}}/example-server#db_password>"

# -----------------------------------------------------------------------------
# Service / networking
# -----------------------------------------------------------------------------
service:
  enabled: true
  type: ClusterIP
  port: 8080
  targetPort: 8080

# OpenShift Route (preferred over Ingress on OCP).
route:
  enabled: false
  # host is usually env-specific; leave empty to let OpenShift assign one.
  host: ""
  tls:
    enabled: true
    termination: edge

# -----------------------------------------------------------------------------
# Pod resources / scheduling
# -----------------------------------------------------------------------------
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Probes. Disable if your MCP server has no HTTP health endpoint.
probes:
  enabled: true
  path: /healthz
  port: 8080

# OpenShift-friendly pod security context (works with the restricted SCC;
# do NOT pin runAsUser -- let OCP assign one from the namespace range).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# Extra annotations on the POD template only. Handy to force a rollout on a
# same-tag re-push without `oc rollout restart`, e.g. from CI:
#   --set podAnnotations.rolloutTrigger=$CI_COMMIT_SHA
podAnnotations: {}

# Extra labels/annotations applied to all resources.
commonLabels: {}
commonAnnotations: {}
