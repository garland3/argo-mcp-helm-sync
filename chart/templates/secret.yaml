{{- if .Values.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-server.fullname" . }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- /*
    Each value is a Vault reference. We substitute the per-env vault prefix
    for the {{vault}} token here in Helm; the resulting <path:...#key> token
    is resolved at Argo sync time by the Argo CD Vault Plugin (AVP).
  */}}
  {{- range $key, $val := .Values.secretEnv }}
  {{ $key }}: {{ include "mcp-server.vaultRef" (dict "ref" $val "ctx" $) | quote }}
  {{- end }}
{{- end }}
