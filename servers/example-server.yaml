# =============================================================================
# Per-MCP-server config.
#
# Drop a new file like this into servers/ and the ApplicationSet will
# automatically create a prod AND a qual Argo Application for it -- no edits
# to the ApplicationSet required.
#
# Everything here is passed to the reusable chart/ as Helm values. The env
# (env.name / env.namespace) is injected at render time -- by the ApplicationSet
# (GitOps) or by `--set` from your CI pipeline (non-GitOps) -- so you do NOT set
# it here.
#
# Vault references: use the literal token {{namespace}} for the per-env segment.
# It expands to env.name (qual|prod) automatically, e.g.
#   <path:secret/data/mcp/{{namespace}}/example-server#openai_api_key>
#     prod -> <path:secret/data/mcp/prod/example-server#openai_api_key>
#     qual -> <path:secret/data/mcp/qual/example-server#openai_api_key>
# =============================================================================

# Used as the app name and the Vault sub-path. Keep it DNS-safe.
nameOverride: example-server

image:
  registry: registry.example.com
  repository: mcp/example-server
  tag: "1.4.2"

replicaCount: 1

extraEnv:
  LOG_LEVEL: info
  MCP_TRANSPORT: streamable-http

secretEnv:
  OPENAI_API_KEY: "<path:secret/data/mcp/{{namespace}}/example-server#openai_api_key>"
  DB_PASSWORD: "<path:secret/data/mcp/{{namespace}}/example-server#db_password>"

service:
  enabled: true
  port: 8080
  targetPort: 8080

route:
  enabled: true
  tls:
    enabled: true
    termination: edge

probes:
  enabled: true
  path: /healthz
  port: 8080
